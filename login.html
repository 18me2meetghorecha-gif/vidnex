<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vidnex | Login</title>
  <meta name="description" content="Log in to your Vidnex account." />
  <link rel="stylesheet" href="assets/css/styles.css?v=2.0" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">
      <img src="assets/images/vidnex-logo.png" alt="Vidnex" class="logo-image" />
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
    </nav>
  </header>

  <main class="page reveal">
    <section class="page-hero">
      <p class="eyebrow">Sign In</p>
      <h1>Welcome back</h1>
      <p class="lead">Log in to your Vidnex account to continue.</p>
    </section>

    <div class="form-container">
      <form id="loginForm" class="contact-form" method="POST">
        <div class="form-group">
          <label for="login-email">Gmail Address</label>
          <input id="login-email" name="email" type="email" placeholder="yourname@gmail.com" required />
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" required />
        </div>

        <div id="loginMessage" class="form-message hidden"></div>

        <button class="btn btn-primary" type="submit">Log In</button>

        <p class="auth-helper">
          Don't have an account? <a href="register.html" class="text-link">Register here</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Vidnex</p>
    <div class="footer-links">
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const messageDiv = document.getElementById("loginMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      const result = await AuthModule.login(email, password);

      if (result.success) {
        messageDiv.className = "form-message success";
        messageDiv.textContent = result.message;
        messageDiv.style.display = "block";
        setTimeout(() => {
          window.location.href = "profile.html";
        }, 1500);
      } else {
        messageDiv.className = "form-message error";
        messageDiv.textContent = result.error;
        messageDiv.style.display = "block";
      }
    });
  </script>
</body>
</html>
